<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap');

        * {
            padding: 0;
            margin: 0;
        }

        body {
            font-family: 'Manrope', sans-serif;
        }

        nav {
            display: flex;
            justify-content: center;
            border-bottom: 1px solid gray;
            /* background-color: black; */
        }

        .nav-items {
            width: 80%;
            /* background-color: #00ffff; */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-items ul {
            display: flex;
            list-style-type: none;
        }

        .nav-items li {
            margin-right: 16px;
            margin-left: 16px;
        }

        .nav-items a {
            text-decoration: none;
            color: black;
            text-transform: uppercase;
        }

        .nav-items a:hover {
            color: pink;
            text-decoration: underline;
        }
        .nav-items img{
            width: 48px;
            height: 48px;
        }
        /* git add . */
        /* git commit -m "Built the nav bar" */
        /* git push */
    </style>
</head>

<body>
    <!-- semantic tags -->
    <nav>
        <div class="nav-items">
            <img src="images/icons8-my-computer-64.png" alt="Company logo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Team</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </div>
    </nav>

</body>

</html>
