<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }
        table{
            width: 75%;
            border: 1px solid bisque;
            margin: auto;
            border-collapse: collapse; /* merge borders */
        }
        th{
            color: #ff0000;
            border: 1px solid blue;
            padding: 12px 6px;
            text-align: left;
            background-color: #00ffff;
        }
        td{
          color: #000059;
            border: 1px solid black;
            padding: 12px 6px;
            text-align: left;  
        }

        
        .salary{
            color: chartreuse;
            font-weight: bold;
        }

        /* CSS frameworks Bootstrap */
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mauro</td>
                <td>Nairobi</td>
                <td>21</td>
                <td class ="salary">60,000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Mwano</td>
                <td>kisumu</td>
                <td>25</td>
                <td  class ="salary">80,000</td>
            </tr>
            <tr>
                <td>Shanie</td>
                <td>Mwakio</td>
                <td>Eldoret</td>
                <td>28</td>
                <td  class ="salary">20,000</td>
            </tr>
            <tr>
                <td>James</td>
                <td>Mwaniki</td>
                <td>Busia</td>
                <td>50</td>
                <td  class ="salary">800,000</td>
            </tr>

        </tbody>
    </table>

    <!-- List unordered -->
    <ul>
        <li>Nairobi</li>
        <li>Eldoret</li>
        <li>Kisumu</li>
        <li>Mombasa</li>
        <li>Busia</li>
    </ul>
</body>

</html>
